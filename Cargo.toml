[package]
name = "framework-led-matrix"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Self-playing games and widgets for the Framework 16 LED Matrix input modules"
authors = ["Haibread <39999956+Haibread@users.noreply.github.com>"]
license = "MIT"
readme = "README.md"

[[bin]]
name = "ledmat"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
clap = { version = "4.6.6", features = ["derive", "env"] }
rand = "0.10.2"
ratatui = "0.29.0"
rustfft = "6.4.1"
serialport = { version = "4.9.0", default-features = false }
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "signal", "sync", "net", "io-util"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
zbus = { version = "5.13.2", default-features = false, features = ["blocking-api", "tokio"] }

[dev-dependencies]
mockall = "0.15.0"

[lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
